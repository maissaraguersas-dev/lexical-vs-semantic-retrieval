name: Build paper PDF

on:
  push:
    branches: [main]
    paths: ["paper/**"]
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: |
          curl -L https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz -o tectonic.tar.gz
          tar -xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Compile paper body
        run: cd paper && tectonic research_paper.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-paper-body
          path: paper/research_paper.pdf
